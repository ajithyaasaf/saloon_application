version: '3.8'

services:
  # ==========================================
  # POSTGRESQL DATABASE
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: saloon_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER:-saloon_prod_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME:-saloon_prod_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M
        reservations:
          cpus: '0.5'
          memory: 1024M
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-saloon_prod_user} -d ${DATABASE_NAME:-saloon_prod_db}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saloon_internal_network

  # ==========================================
  # REDIS CACHE & QUEUES
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: saloon_prod_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_prod_data:/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2048M
        reservations:
          cpus: '0.25'
          memory: 512M
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saloon_internal_network

  # ==========================================
  # BACKEND API (NestJS)
  # ==========================================
  api:
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile
    container_name: saloon_prod_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_PREFIX: api
      DATABASE_URL: postgresql://${DATABASE_USER:-saloon_prod_user}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME:-saloon_prod_db}?schema=public&connection_limit=20
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      QUEUE_REDIS_HOST: redis
      QUEUE_REDIS_PORT: 6379
      QUEUE_REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_DOMAIN: ${R2_PUBLIC_DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/v1/health/readiness']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - saloon_internal_network
      - saloon_edge_network

  # ==========================================
  # SALON OWNER DASHBOARD (Next.js)
  # ==========================================
  salon-dashboard:
    build:
      context: ../../
      dockerfile: apps/salon-dashboard/Dockerfile
    container_name: saloon_prod_salon_dashboard
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: https://api.saloon.godivatech.com
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    networks:
      - saloon_edge_network

  # ==========================================
  # SUPER-ADMIN DASHBOARD (Next.js)
  # ==========================================
  admin-dashboard:
    build:
      context: ../../
      dockerfile: apps/admin-dashboard/Dockerfile
    container_name: saloon_prod_admin_dashboard
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3002
      NEXT_PUBLIC_API_URL: https://api.saloon.godivatech.com
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    networks:
      - saloon_edge_network

  # ==========================================
  # NGINX REVERSE PROXY & SSL TERMINATION
  # ==========================================
  nginx:
    image: nginx:1.25-alpine
    container_name: saloon_prod_nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - salon-dashboard
      - admin-dashboard
    networks:
      - saloon_edge_network

networks:
  saloon_internal_network:
    internal: true
  saloon_edge_network:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  nginx_ssl:
