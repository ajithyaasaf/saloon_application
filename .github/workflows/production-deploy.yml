name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. TEST & LINT VERIFICATION
  # ==========================================
  verify:
    name: Lint, Test & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @saloon/database prisma:generate

      - name: Run Monorepo Test Suites
        run: pnpm test

      - name: Verify Full Workspace Build
        run: pnpm turbo run build

  # ==========================================
  # 2. DOCKER BUILD & DEPLOYMENT
  # ==========================================
  deploy:
    name: Build Production Docker Images
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: saloon-api:latest

      - name: Build Salon Dashboard Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/salon-dashboard/Dockerfile
          push: false
          tags: saloon-salon-dashboard:latest

      - name: Build Admin Dashboard Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/admin-dashboard/Dockerfile
          push: false
          tags: saloon-admin-dashboard:latest
